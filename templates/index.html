<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic AI Assistant</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #212121;
        color: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 18px 24px;
        border-bottom: 1px solid #414141;
        font-size: 20px;
        font-weight: bold;
      }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .message {
        max-width: 800px;
        width: fit-content;
        padding: 14px 18px;
        border-radius: 16px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user {
        align-self: flex-end;
        background: #343541;
      }

      .assistant {
        align-self: flex-start;
        background: #2b2b2b;
      }

      form {
        display: flex;
        gap: 10px;
        width: min(850px, 94%);
        margin: 0 auto 24px;
        padding: 8px;
        background: #303030;
        border: 1px solid #555;
        border-radius: 18px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 14px;
        background: transparent;
        color: white;
        border: none;
        outline: none;
        font-size: 16px;
      }

      button {
        padding: 12px 18px;
        background: #10a37f;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
      }

      footer {
        text-align: center;
        color: #aaa;
        font-size: 12px;
        padding: 0 12px 12px;
      }
    </style>
  </head>
  <body>
    <header>🤖 Agentic AI Assistant</header>

    <main id="chat">
      <div class="message assistant">
        Hello! I'm your AI assistant powered by your local model. What would you
        like to learn today?
      </div>
    </main>

    <form id="chat-form">
      <input
        id="prompt"
        placeholder="Ask anything..."
        autocomplete="off"
        required
      />
      <button id="send" type="submit">Send</button>
    </form>

    <footer>Powered by your local AI model • Responses may take time</footer>

    <script>
      const form = document.getElementById("chat-form");
      const input = document.getElementById("prompt");
      const chat = document.getElementById("chat");
      const send = document.getElementById("send");

      function addMessage(text, role) {
        const message = document.createElement("div");
        message.className = "message " + role;
        message.textContent = text;
        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;
        return message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const prompt = input.value.trim();
        if (!prompt) return;

        addMessage(prompt, "user");
        input.value = "";
        send.disabled = true;

        const reply = addMessage("Thinking...", "assistant");

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: prompt }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Request failed");
          }

          reply.textContent =
            data.response ||
            data.answer ||
            data.reply ||
            "No response received.";
        } catch (error) {
          reply.textContent = "Error: " + error.message;
        } finally {
          send.disabled = false;
          input.focus();
          chat.scrollTop = chat.scrollHeight;
        }
      });
    </script>
  </body>
</html>
